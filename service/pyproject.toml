[project]
name = "sensei-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.8.2"
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-timeout==2.4.0",
  "httpx==0.28.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# a missing WebSocket message would otherwise block receive() forever
timeout = 10

[tool.uvicorn]
factory = false
