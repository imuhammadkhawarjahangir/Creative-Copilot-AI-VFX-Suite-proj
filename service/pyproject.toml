[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensei-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.142.4",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5"
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-timeout==2.4.0",
  "httpx2==2.13.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# a missing WebSocket message would otherwise block receive() forever
timeout = 10

[tool.setuptools.packages.find]
include = ["sensei_service*"]
